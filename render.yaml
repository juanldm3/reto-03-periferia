# Blueprint de Render: crea el servicio web en el plan gratuito.
services:
  - type: web
    name: reto-03-agente-oc
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.20.0"
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_ACCESS_KEY
        sync: false
